exclude = ["target", "tests/lib/**/*"]

[commands.perltidy]
type = "both"
include = ["**/*.{pl,pm,t,psgi}"]
cmd = ["perltidy", "--profile=$PRECIOUS_ROOT/perltidyrc"]
lint_flags = ["--assert-tidy", "--no-standard-output", "--outfile=/dev/null"]
tidy_flags = ["--backup-and-modify-in-place", "--backup-file-extension=/"]
ok_exit_codes = 0
lint_failure_exit_codes = 2
ignore_stderr = "Begin Error Output Stream"

[commands.typos]
type = "both"
include = "**/*"
exclude = "**/*.tar.gz"
invoke = "once"
cmd = "typos"
tidy_flags = "--write-changes"
ok-exit-codes = 0
lint-failure-exit-codes = 2

[commands.oxfmt]
type = "both"
include = ["**/*.md", "**/*.yml", "**/*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint_flags = "--check"
tidy_flags = "--in-place"
ok_exit_codes = 0
lint_failure_exit_codes = 1
ignore_stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.zizmor]
type = "lint"
include = ".github/**/*.yml"
invoke = "once"
path-args = "none"
working-dir = "root"
cmd = ["zizmor", "--persona", "pedantic", "."]
ok-exit-codes = 0
# zizmor exits with 11-14 depending on the severity of the worst finding. Every other non-zero code
# means zizmor itself failed - 1 for an audit error, 2 for bad arguments, 3 for collecting no inputs
# at all - and none of those are lint failures, so precious should treat them as hard errors.
lint-failure-exit-codes = [11, 12, 13, 14]
expect-stderr = true
