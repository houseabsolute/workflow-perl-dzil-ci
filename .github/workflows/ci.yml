name: Perl dzil CI

on:
  workflow_call:
    inputs:
      dist:
        description: "The Perl distro being tested."
        type: string
        required: true
      ref:
        description: "The ref of this reusable workflow."
        type: string
        required: true
      min-perl:
        description: "The minimum version of Perl to test with."
        type: string
        default: "5.24.4"
      with-threads:
        description: "If true, then latest Perl with threads enabled will be added to the matrix."
        type: boolean
        default: false
      additional-modules:
        description: "Additional modules to install. This should be a whitespace-separated list."
        type: string
      apt-packages-for-author-tests:
        description:
          "Apt packages to install when running author tests as a string containing a
          whitespace-separated list of packages."
        type: string
      apt-packages:
        description:
          "Apt packages needed to install this dist's runtime and test deps, as a string containing
          a whitespace-separated list of packages. These are installed for the author tests and for
          every Linux entry in the test matrix."
        type: string
      brew-packages:
        description:
          "Homebrew packages needed to install this dist's runtime and test deps, as a string
          containing a whitespace-separated list of packages. These are installed for every macOS
          entry in the test matrix."
        type: string
      with-windows:
        description:
          "If false, Windows is left out of the test matrix. Use this for dists that depend on a
          system library with no reasonable Windows story."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-release-tarball:
    name: Build release tarball
    runs-on: ubuntu-latest
    steps:
      - name: Check out Perl project repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: houseabsolute/workflow-perl-dzil-ci
          ref: ${{ inputs.ref }}
          # We have to use `./` at the beginning of a `uses:` path, so putting it under `.git`
          # ensures that tools like `precious` ignore it.
          path: ./.git/.workflow-perl-dzil-ci

      - name: Set up Perl
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/set-up-perl
        with:
          perl-version: latest
          cache-prefix: build-and-author-tests
          cache-extra: bin

      # Without this, GitHub::Meta cannot work out the repo to ask about, and
      # builds a request URI out of the dist abstract instead. GitHub rejects
      # that with a non-JSON error, which the plugin dies trying to parse
      # before falling back to offline data, so the dist loses its GitHub
      # metadata.
      - name: Set github.user for Dist::Zilla::Plugin::GitHub
        run: git config github.user "$REPOSITORY_OWNER"
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Install Dist::Zilla and Test::Harness
        run: cpm install --verbose --show-build-log-on-failure --global Dist::Zilla Test::Harness

      - name: Generate list of author deps
        # Some of my distros have author deps under `inc::` that live in the same repo.
        run: dzil authordeps | grep -v '^inc::' > /tmp/dzil-authordeps.txt

      - name: Upload dzil authordeps artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzil-authordeps.txt
          path: /tmp/dzil-authordeps.txt

      - name: Install author deps
        run: |
          cpm install --verbose --show-build-log-on-failure --global $(cat /tmp/dzil-authordeps.txt)

      - name: Build release tarball
        run: dzil build

      - name: Upload release tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.dist }}.tar.gz"
          path: "*.tar.gz"

  define-matrix:
    name: Define test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: houseabsolute/workflow-perl-dzil-ci
          ref: ${{ inputs.ref }}
          path: ./.git/.workflow-perl-dzil-ci

      - name: Define test matrix
        id: define-matrix
        run: |
          perl ./.git/.workflow-perl-dzil-ci/.github/workflows/define-test-matrix.pl "$MIN_PERL" "$WITH_THREADS" "$WITH_WINDOWS"
        env:
          MIN_PERL: ${{ inputs.min-perl }}
          WITH_THREADS: ${{ inputs.with-threads }}
          WITH_WINDOWS: ${{ inputs.with-windows }}

      - name: Show matrix
        run: |
          echo "$MATRIX" | jq .
        env:
          MATRIX: ${{ steps.define-matrix.outputs.matrix }}

  author-tests:
    needs: build-release-tarball
    name: Author tests with Perl latest
    runs-on: ubuntu-latest
    steps:
      - name: Install extra apt packages
        run: |
          set -e
          set -x

          # This will turn newlines into spaces.
          packages="$(perl -E 'say join q{ }, grep { length } split /\s+/, "$ENV{APT_PACKAGES} $ENV{APT_PACKAGES_FOR_AUTHOR_TESTS}"')"
          if [ -n "$packages" ]; then
              sudo apt-get update
              sudo apt-get --yes install $packages
          fi
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
          APT_PACKAGES_FOR_AUTHOR_TESTS: ${{ inputs.apt-packages-for-author-tests }}

      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: houseabsolute/workflow-perl-dzil-ci
          ref: ${{ inputs.ref }}
          path: ./.git/.workflow-perl-dzil-ci

      - name: Download and unpack release tarball
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/download-and-unpack-release-tarball
        with:
          dist: ${{ inputs.dist }}

      - name: Set up Perl
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/set-up-perl
        with:
          perl-version: latest
          cache-prefix: build-and-author-tests
          cache-extra: bin

      - name: Install mise
        run: |
          set -e
          set -x

          curl https://mise.run | sh
          mise install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aspell
        run: |
          set -e
          set -x

          sudo apt-get -y update
          sudo apt-get -y install aspell

      - name: Install module deps
        run: |
          cpm install --verbose --show-build-log-on-failure --global --with-all --cpanfile ./cpanfile

      - name: Install additional deps
        run: |
          cpm install --verbose --show-build-log-on-failure --global $ADDITIONAL_MODULES
        env:
          ADDITIONAL_MODULES: ${{ inputs.additional-modules }}
        if: "!inputs.additional-modules != ''"

      - name: Run Makefile.PL and make
        run: |
          perl Makefile.PL
          make -j 24

      - name: Run tests
        run: |
          AUTOMATED_TESTING=1 \
              AUTHOR_TESTING=1 \
              EXTENDED_TESTING=1 \
              RELEASE_TESTING=1 \
              mise exec -- prove -br -j 24 t/ xt/

  test-matrix:
    needs:
      - build-release-tarball
      - define-matrix
    name: ${{ matrix.os-and-perl.name }}
    runs-on: ${{ matrix.os-and-perl.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      # Windows has no equivalent. A dist that needs a system library there
      # should set `with-windows: false` instead.
      - name: Install extra apt packages
        run: |
          set -e
          set -x

          sudo apt-get update
          # This will turn newlines into spaces.
          packages="$(perl -E 'say join q{ }, grep { length } split /\s+/, $ENV{APT_PACKAGES}')"
          sudo apt-get --yes install $packages
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        if: "inputs.apt-packages != '' && startsWith(matrix.os-and-perl.runs-on, 'ubuntu')"

      - name: Install extra Homebrew packages
        run: |
          set -e
          set -x

          # This will turn newlines into spaces.
          packages="$(perl -E 'say join q{ }, grep { length } split /\s+/, $ENV{BREW_PACKAGES}')"
          brew install $packages

          # Homebrew installs under its own prefix, which is not on the
          # compiler's default search path, so an XS dist looking for a header
          # will not find it. CPATH and LIBRARY_PATH are picked up by cc
          # itself, so this works without every Makefile.PL needing its own
          # flag for it.
          prefix="$(brew --prefix)"
          echo "CPATH=${prefix}/include${CPATH:+:${CPATH}}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${prefix}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
        env:
          BREW_PACKAGES: ${{ inputs.brew-packages }}
        if: "inputs.brew-packages != '' && startsWith(matrix.os-and-perl.runs-on, 'macos')"

      - name: Check out workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: houseabsolute/workflow-perl-dzil-ci
          ref: ${{ inputs.ref }}
          path: ./.git/.workflow-perl-dzil-ci

      - name: Download and unpack release tarball
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/download-and-unpack-release-tarball
        with:
          dist: ${{ inputs.dist }}

      - name: Set up Perl
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/set-up-perl
        with:
          perl-version: ${{ matrix.os-and-perl.perl-version }}
          multi-thread: ${{ matrix.os-and-perl.multi-thread }}
          cache-prefix: test-matrix

      - name: Install module deps
        # If we use bash on windows, cpm blows up in weird ways from missing prereqs.
        run: |
          cpm install --verbose --show-build-log-on-failure --global --cpanfile ./cpanfile

      - name: Install additional deps
        run: |
          cpm install --verbose --show-build-log-on-failure --global $ADDITIONAL_MODULES
        env:
          ADDITIONAL_MODULES: ${{ inputs.additional-modules }}
        if: "inputs.additional-modules != ''"

      - name: Run Makefile.PL and make (Linux/macOS)
        shell: bash
        run: |
          perl Makefile.PL
          make -j 24
        if: "!contains(matrix.os-and-perl.runs-on , 'windows')"

      - name: Run Makefile.PL and make (Windows)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          function Run-Command {
              param(
                  [string]$Command,
                  [string[]]$Arguments
              )

              & $Command @Arguments

              if ($LastExitCode -ne 0) {
                  Write-Error "Command failed with exit code ${LastExitCode}: $Command $($Arguments -join ' ')"
                  exit $LastExitCode
              }
          }

          Run-Command -Command "perl" -Arguments @("Makefile.PL")
          Run-Command -Command "make" -Arguments @("-j", "24")
        if: contains(matrix.os-and-perl.runs-on, 'windows')

      - name: Run tests
        # If we use bash on Windows we get an error that prove is not in the $PATH.
        run: |
          prove -br -j 24 t/
