name: Download and Unpack Release Tarball
description: "This will download the release tarball and unpack it"

inputs:
  dist:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "${{ inputs.dist }}.tar.gz"

    - name: Untar release tarball
      shell: bash
      run: |
        set -e
        set -x

        tar -xvzf "$DIST"-*.tar.gz
        mv "$DIST"-*/* .
        rm -fr "$DIST"-*
      env:
        DIST: ${{ inputs.dist }}
