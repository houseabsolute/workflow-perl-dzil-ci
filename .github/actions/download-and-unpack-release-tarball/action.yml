name: Download and Unpack Release Tarball
description: "This will download the release tarball and unpack it"

inputs:
  dist:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: "${{ inputs.dist }}.tar.gz"

    - name: Untar release tarball
      shell: bash
      run: |
        set -e
        set -x

        tar -xvzf "$DIST"-*.tar.gz
        mv "$DIST"-*/* .
        rm -fr "$DIST"-*
      env:
        DIST: ${{ inputs.dist }}
